baseURL = "https://gonoring.github.io/monte-siao-vix/"
locale = "pt-BR"
title = "Monte Sião Grande Vitória — Pregações em texto"
# theme = "PaperMod"  (redesenho 2026-11: layouts proprios em layouts/)
defaultContentLanguage = "pt"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
pagination.pagerSize = 20

[outputFormats.TAGSDATA]
  mediaType = "application/json"
  baseName = "tags-data"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "TAGSDATA"]

[taxonomies]
  tag = "tags"
  pregador = "pregadores"

[params]
  env = "production"
  title = "Monte Sião Grande Vitória — Pregações em texto"
  description = "Acervo de transcrições das pregações da Igreja Monte Sião Grande Vitória. Texto, resumo e trechos marcantes de cada mensagem."
  author = ["Igreja Monte Sião Grande Vitória"]
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "Monte Sião Grande Vitória — Pregações em texto"
    Content = "Acervo das pregações da Igreja Monte Sião Grande Vitória, em texto. Use a busca para encontrar por pregador, tema ou referência bíblica."

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 3
    limit = 20
    keys = ["title", "permalink", "summary", "content"]
